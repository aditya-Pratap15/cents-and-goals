name: Daily Facebook Ingestion (Phase 1)

# Automated cron disabled on GitHub cloud runners because Meta blocks cloud datacenter IPs.
# Ingestion runs locally via Windows Task Scheduler at 03:00 PM IST (using residential IP).
# Manual workflow_dispatch is kept for testing if needed.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run Jeff Rose Scraper & Drive Ingestion
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: node scripts/fetch_jeff_rose.js
