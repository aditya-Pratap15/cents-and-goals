name: Daily Facebook Ingestion (Phase 1)

on:
  schedule:
    # 03:00 AM UTC (08:30 AM IST / 11:00 PM EDT previous night)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run Jeff Rose Scraper & Drive Ingestion
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: node scripts/fetch_jeff_rose.js
